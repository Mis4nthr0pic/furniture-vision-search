name: Close pipeline issue on merge

on:
  pull_request:
    types: [closed]

permissions:
  issues: write

jobs:
  close-linked-issue:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close pipeline issue from branch name
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const match = branch.match(/^step\/(\d+)-/);
            if (!match) {
              core.info(`Branch ${branch} is not a step/* branch — skipping`);
              return;
            }

            const step = parseInt(match[1], 10);
            const issueNumber = step + 1;
            const { owner, repo } = context.repo;
            const prUrl = context.payload.pull_request.html_url;

            const issue = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber,
            });

            const labels = issue.data.labels.map((l) => (typeof l === "string" ? l : l.name));
            if (!labels.includes("pipeline")) {
              core.info(`Issue #${issueNumber} lacks pipeline label — skipping`);
              return;
            }

            if (issue.data.state === "closed") {
              core.info(`Issue #${issueNumber} already closed`);
              return;
            }

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issueNumber,
              state: "closed",
            });

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: `Auto-closed: merged ${prUrl}`,
            });

            core.info(`Closed issue #${issueNumber} for step ${step}`);

      - name: Close issues linked in PR body
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body ?? "";
            const matches = [...body.matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)];
            const { owner, repo } = context.repo;
            const prUrl = context.payload.pull_request.html_url;

            for (const match of matches) {
              const issueNumber = parseInt(match[1], 10);
              const issue = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              if (issue.data.state === "closed") continue;

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issueNumber,
                state: "closed",
              });

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `Auto-closed via PR body keyword: merged ${prUrl}`,
              });

              core.info(`Closed linked issue #${issueNumber}`);
            }
