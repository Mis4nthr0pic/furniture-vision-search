services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-4000}
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-catalog}
      - MONGODB_PRODUCTS_COLLECTION=${MONGODB_PRODUCTS_COLLECTION:-products}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      - LLM_EMBED_BASE_URL=${LLM_EMBED_BASE_URL:-https://openrouter.ai/api/v1}
      - LLM_VISION_MODEL=${LLM_VISION_MODEL:-openai/gpt-4o}
      - LLM_EMBED_MODEL=${LLM_EMBED_MODEL:-openai/text-embedding-3-small}
      - LLM_CHAT_MODEL=${LLM_CHAT_MODEL:-openai/gpt-4o}
      - OPENROUTER_REFERER=${OPENROUTER_REFERER:-http://localhost:5173}
      - OPENROUTER_TITLE=${OPENROUTER_TITLE:-Furniture Vision Search}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      - BACKEND_URL=http://backend:4000
    depends_on:
      - backend

volumes:
  backend-data:
